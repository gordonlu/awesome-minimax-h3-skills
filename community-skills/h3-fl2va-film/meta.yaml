summary-en: Exactly two images — a start frame and an end frame — and a continuous, progressively narrowing motion path between them.
summary-cn: 恰好两张图（首帧 + 尾帧），补上一条连续、逐帧收窄的转换路径。
desc-en: |
  For "from A to B" transitions with exactly two reference images: pose-to-pose, outfit
  changes, object-state changes, scene or lighting transitions, growth or decay, assembly
  or deconstruction. Picture 1 anchors the opening, Picture 2 anchors the ending; the Skill
  writes the FL2VA prompt whose body supplies the motion path — never two static descriptions —
  following base-en.txt exactly: verbatim alignment line, single-shot preference, the
  first-frame state → intermediate changes → progressively narrowing differences → last-frame
  state structure, and identity anchors that survive the transformation. One image or more
  than two keyframes are routed to h3-keyframe-film; pure text to h3-promo-film.
desc-cn: |
  专为「恰好两张参考图」的 A→B 转换需求：姿态转换、换装、物体状态变化、场景或光线过渡、
  生长与衰变、组装与拆解。Picture 1 锚定开场、Picture 2 锚定结尾；Skill 撰写 FL2VA 提示词，
  正文只写连接两帧的运动路径——绝不重复两段静态描述——严格遵循 base-en.txt：逐字对齐行、
  单镜头优先、首帧状态→可观察的中间变化→差异逐帧收窄→尾帧状态，并让身份锚点在转换中存活。
  单图或多关键帧路由到 h3-keyframe-film，纯文本路由到 h3-promo-film。
