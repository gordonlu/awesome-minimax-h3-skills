summary-en: Create epic 7s cloud-sea clips of colossal mythic beings with fast-slow contrast beats, volumetric light and layered texture.
summary-cn: 生成 7 秒史诗级云海巨兽短片：快慢对比节拍、体积光与多层质感，拒绝全片慢镜。
desc-en: |
  Colossal mythological beings (cloud whales, sky leviathans, cloud dragons) crossing an endless
  sea of clouds. Each clip is one continuous shot with a drop/push-in opening, an explosive
  break-through beat at real-time speed, one Impact peak (burst, tail-whip, crash-dive), and a
  re-entry into the wide reset — bracketed fast-slow rhythm, never all slow motion. Epic look
  enforced by sleek pearl-grey satin skin, a single starlit spine, a named light system and
  atmosphere layer stack. Ships with a runnable 7s canonical prompt plus two variants. T2VA only.
desc-cn: |
  巨大的神话生物（云海巨鲸、天空利维坦、云龙）横渡无尽云海。每片为单镜头：开场高空俯压/推近
  建立尺度 → 自然速度的破云爆发拍 → 一个冲击峰值（爆起、甩尾、坠海）→ 没入云海的全景收束，
  用「快-慢-快」节奏夹住慢拍，绝不做全片慢镜。史诗感由尺标、表面质感（苔藓/藤蔓/星辉鳞片）、
  命名光照系统与大气层次共同保证。内置可直接运行的 7s canonical prompt 与两个变体，仅 T2VA。
