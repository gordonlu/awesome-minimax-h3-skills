summary-en: Write runnable MiniMax H3 keyframe-film prompts — multi-keyframe montages, first-last frame transitions, final-frame landings — images lock identity, text drives motion.
summary-cn: 图片锁形象、文字锁动作，写出可直接运行的 MiniMax H3 关键帧短片提示词（多关键帧 / 首尾帧 / 尾帧）。
desc-en: |
  Covers first-frame (I2VA), first+last frame (FL2VA), and last-frame-only (L2VA) generation,
  plus multi-keyframe montages. Uses the exact keyframe-alignment instruction lines from
  base-en.txt, identity anchors that survive every frame, and timecoded motion paths that
  land on the locked end frame. Not for pure-text requests (h3-promo-film) or reference-video
  motion transfer (reference-motion-transfer).
desc-cn: |
  覆盖首帧（I2VA）、首+尾帧（FL2VA）、仅尾帧（L2VA）与多关键帧蒙太奇。
  使用 base-en.txt 的关键帧对齐指令固定句式，身份锚点贯穿全片，
  时间码动作路径精确落帧。不适用于纯文本需求（h3-promo-film）或参考视频动作迁移
  （reference-motion-transfer）。
