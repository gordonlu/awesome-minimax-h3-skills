summary-en: Generate a 15s 16:9 mixed-media short — a 2D anime JK schoolgirl runs through photorealistic Shanghai, trips, and time freezes as the camera orbits her in bullet-time. One continuous shot.
summary-cn: 生成一段 15 秒 16:9 混合媒介短片——二次元 JK 女生跑过实景上海，绊倒瞬间时间冻结，镜头以子弹时间环绕她。一镜到底。
desc-en: |
  For creators who want a 15s 16:9 "mixed media" one-shot: a crisp 2D anime JK schoolgirl exists inside an otherwise photorealistic, documentary-style modern Shanghai street. She runs urgently through real pedestrians, trips on a curb, and at the first instant of the fall TIME FREEZES while the same handheld camera smoothly becomes a precise bullet-time rig that orbits her at waist-to-head height — threading through her suspended school bag, books and instant-photo prints — then widens, returns to the original angle and time resumes as she catches herself on one knee. One unbroken physical camera trajectory, no cuts. I2VA: one character reference image locks the girl's face, body, outfit and anime style (reference only, never first frame). Includes a verified 15s output.
desc-cn: |
  面向想要 15 秒 16:9「混合媒介」一镜到底的创作者：干净的二次元 JK 女生置身于写实的、纪录片质感的现代上海街景。她匆忙跑过真实路人，被路沿绊倒，在失衡的第一瞬间时间冻结；同一台手持相机平滑变为精确的子弹时间装置，在腰到头高度环绕她——穿过悬浮的书包、课本与拍立得照片——再拉宽、回到原角度，时间恢复，她单手撑地跪稳。一条不间断的物理镜头轨迹，无切镜。I2VA：一张角色参考图锁定女生的脸、身材、服装与二次元风格（仅参考，不作为首帧）。附带一条已跑通的 15 秒成片。
