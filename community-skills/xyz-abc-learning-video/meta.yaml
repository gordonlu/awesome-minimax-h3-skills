summary:
  en: Generate a 15s animated ABC learning video teaching letters X, Y, Z to children ages 3–6 — adorable rounded 3D style with soft pastel colors and premium minimalist aesthetic.
  zh: 生成 15 秒 ABC 字母教学动画（X、Y、Z），面向 3–6 岁儿童——可爱圆润 3D 风格，柔和色调，极简高级质感。
description:
  en: |
    A 15-second animated educational video for children ages 3–6, teaching the letters X, Y, and Z following the pattern: LETTER → SOUND → OBJECT → PLAYFUL ACTION → OBJECT NAME.

    Visual style: adorable rounded 3D characters and objects, soft pastel colors, gentle facial expressions, simple recognizable forms, polished toy-like materials. Premium minimalist technology aesthetic with clean off-white backgrounds, generous white space, elegant composition, soft studio lighting, subtle reflections, smooth gradients, rounded geometry, crisp typography, and extremely polished transitions.

    Animation: X transforms into a cute X-ray card with a friendly teddy-bear skeleton, Y stretches into a colorful yo-yo that drops and spins, Z expands into a rounded zoo entrance with a waving lion and trunk-lifting elephant. Each letter gets a soft pastel glow, slow pacing, and clear visibility before transformation. Ends with a recap tile and star mascot.
  zh: |
    15 秒儿童教育动画，教 3–6 岁儿童学习字母 X、Y、Z，遵循"字母→发音→物体→动作→名称"的教学节奏。

    视觉风格：可爱圆润 3D 角色与物体，柔和色调，温和表情，简洁可辨识的造型，精致玩具质感。极简高级科技美学——干净米白背景、大量留白、优雅构图、柔和影棚灯光、微妙反射、平滑渐变、圆润几何、清晰字体、极致丝滑转场。

    动画：X 变成可爱 X 光卡片（友好泰迪熊骨架），Y 拉伸成彩色溜溜球（下落旋转），Z 展开为圆润动物园入口（挥手狮子和举鼻大象）。每个字母有柔和光晕、缓慢节奏、变形前清晰可见。结尾三格回顾 + 星星吉祥物。
