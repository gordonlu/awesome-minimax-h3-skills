summary-en: Generate a 15s cozy claymation café short — handcrafted stop-motion style with soft natural lighting, tactile paper-and-clay texture, and delicate macro cinematography.
summary-cn: 生成一段 15 秒温馨黏土咖啡店短片——手工定格动画风格，柔和自然光，细腻纸黏土质感，精致微距摄影。
desc-en: |
  For creators who want a 15s cozy claymation café short: a handcrafted stop-motion animation where a coffee shop scene is rendered in warm, cute paper-clay and ceramic textures. The camera stays mostly fixed with a gentle, slow macro breathing push-in, maintaining generous white space and the original composition. Barista makes coffee, customers sip and chat, steam drifts like cotton, plant leaves sway, a wooden sign rocks, and hand-drawn scrapbook doodles (hearts, stars, coffee beans) occasionally pop and flicker. Soft natural warm-white daylight, ivory/beige/sage/terracotta low-saturation palette. Premium handcrafted claymation, miniature stop-motion, tactile texture, shallow depth of field, delicate macro cinematography.
desc-cn: |
  面向想要 15 秒温馨黏土咖啡店短片的创作者：手工定格动画，整个场景用温暖可爱的纸黏土与陶土质感呈现。镜头基本固定，只做轻微缓慢的微距呼吸式推进，保持大量留白。吧台后店员制作咖啡，顾客轻抬杯子品尝、转头交谈，咖啡蒸汽如棉絮飘动，绿植叶片微风轻摇，木质招牌左右摆动，背景手绘爱心、星星、咖啡豆偶尔弹动闪现。柔和自然暖白日光，象牙白/米色/鼠尾草绿/陶土色低饱和配色。高级手工定格动画广告质感：温暖、安静、精致、略带童话感。
